[project]
name = "coffee-llm"
version = "0.3.0"
description = "Fine-tuned Qwen3.5-0.8B that parses spoken coffee orders (RU/EN) into a compact format"
readme = "README.md"
# Pinned to 3.12 (the version this project was developed and evaluated on).
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# PIZZA benchmark (CC-BY-NC-4.0 data; never used by the production parser).
# regex (not re) for the tokenizer split pattern's Unicode classes, used by
# paper/make_tokenization.py to measure subword boundaries without torch.
pizza = ["anytree>=2.12", "matplotlib>=3.8", "regex>=2024.0"]

[dependency-groups]
# GPU-only, installed on the server with: uv sync --group gpu
# Kept out of the default environment so the Mac is unaffected.
gpu = [
    "torch>=2.4",
    "transformers>=5",
    "trl>=0.21",
    "peft>=0.14",
    "datasets>=3",
    "accelerate>=1.0",
    "unsloth",
    "unsloth_zoo",
    "xgrammar",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Tests that scan the full 2.46M pool are deselected by default so the suite stays fast.
# `make test-all` (or `pytest -m slow`) runs them; `make check` covers the same ground.
addopts = "-m 'not slow'"
markers = ["slow: scans the full training pool, tens of seconds"]

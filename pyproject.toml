[project]
name = "coffee-llm"
version = "0.3.0"
description = "Fine-tuned Qwen3.5-0.8B that parses spoken coffee orders (RU/EN) into a compact format"
readme = "README.md"
# Pinned to 3.12 (the version this project was developed and evaluated on).
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# PIZZA benchmark (CC-BY-NC-4.0 data; never used by the production parser).
pizza = ["anytree>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coffee_parser", "src/pizza_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
